name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/test_investigations.db
        run: pytest -q
      - name: Migration applies and matches the models
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/migrate_check.db
        run: |
          alembic upgrade head
          alembic check
      - name: Accuracy gate
        run: python -m scripts.evaluate

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  extension:
    # The website and the extension are never imported together, so a rename on
    # one side would fail silently in production. Guard that seam here.
    name: Extension (syntax + bridge contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse extension scripts
        run: |
          node --check extension/background.js
          node --check extension/sidepanel.js
          node --check extension/offscreen.js
      - name: Website <-> extension contract
        run: node scripts/check-extension-bridge.mjs
