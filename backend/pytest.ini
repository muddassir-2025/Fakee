[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
# Put this directory (the app root) on sys.path. Without it the suite only ran
# via `python -m pytest`, which prepends the CWD itself; the bare `pytest`
# console script that CI uses left `app` unimportable and every module failed
# to collect with "No module named 'app'".
pythonpath = .
