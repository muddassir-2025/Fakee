# Alembic configuration for the Fakee backend.
#
# The database URL is NOT set here: migrations/env.py reads it from the app
# settings (DATABASE_URL), so the same config works locally (SQLite) and in
# production (Neon PostgreSQL). Run commands from the backend directory:
#
#   alembic upgrade head        # apply all migrations
#   alembic revision -m "..."   # create a new (empty) revision
#   alembic revision --autogenerate -m "..."   # diff against the models

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# Left blank on purpose — supplied programmatically by migrations/env.py.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
