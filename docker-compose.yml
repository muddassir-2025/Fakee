services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-*}
      # The frontend nginx proxies to us, so trust its forwarded headers.
      TRUST_PROXY: ${TRUST_PROXY:-true}
      # Defaults to a local SQLite volume. Provide a Neon URL to use PostgreSQL:
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////app/data/investigations.db}
      # Schema is owned by Alembic in the container (entrypoint runs
      # `alembic upgrade head`), so startup table creation stays off.
      AUTO_CREATE_SCHEMA: ${AUTO_CREATE_SCHEMA:-false}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      EXA_API_KEY: ${EXA_API_KEY:-}
    volumes:
      - backend-data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health/live', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  backend-data:
